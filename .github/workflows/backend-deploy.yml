# 后端：GitHub Actions → 阿里云 ECS（上传代码，不在服务器 git pull）
name: Backend Deploy to Aliyun ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload code to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "."
          target: "/opt/office_backend"
          overwrite: true
          rm: false
          exclude: |
            .git
            venv
            __pycache__
            logs
            .env

      - name: Install deps and restart on ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /opt/office_backend
            PY=python3.8
            command -v $PY >/dev/null || PY=python3
            if [ ! -x venv/bin/python ]; then
              $PY -m venv venv
            fi
            ./venv/bin/python -m pip install --upgrade pip -q
            ./venv/bin/pip install -r requirements.txt -q -i https://pypi.tuna.tsinghua.edu.cn/simple
            if [ ! -f .env ]; then
              echo "ERROR: missing .env on server"
              exit 1
            fi
            if [ -f deploy/office-backend.service ]; then
              cp deploy/office-backend.service /etc/systemd/system/office-backend.service
              systemctl daemon-reload
            fi
            systemctl restart office-backend
            sleep 3
            curl -sf http://127.0.0.1:5000/health
            echo ""
            echo "Deploy OK."

      - name: Health check (public)
        run: |
          curl -sf "http://${{ secrets.DEPLOY_HOST }}:5000/health" || (echo "Public health check failed" && exit 1)
